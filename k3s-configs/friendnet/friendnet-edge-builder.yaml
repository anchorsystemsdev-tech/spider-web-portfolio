apiVersion: batch/v1
kind: Job
metadata:
  name: your-value
  namespace: your-namespace
spec:
  template:
    spec:
      # Use nodeSelector to ensure this runs on your Mac M1 (the ARM64 node)
      nodeSelector:
        kubernetes.io/arch: arm64 
      containers:
      - name: your-value
        image: your-registry/your-image:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            apk add --no-cache git make nodejs npm
            git clone https://github.com/termermc/FriendNet.git /workspace/friendnet
            cd /workspace/friendnet
            # Build the web assets using the Node toolchain in the container
            make webui
            # Cross-compile the client for Linux x86_64 (Laptop / Mini PC)
            env GOOS=linux GOARCH=amd64 go build -o friendnet-client-amd64 friendnet.org/client/cmd/client
            # Drop the finished cross-compiled binary into the host folder
            cp friendnet-client-amd64 /output/
            echo "x86_64 Edge Binary Compiled and Moved to Infra Folder."
        volumeMounts:
        - name: your-value
          mountPath: /your/local/path
      restartPolicy: Never
      volumes:
      - name: your-value
        hostPath:
          path: /your/local/path/friendnet # Target local folder
          type: DirectoryOrCreate
