apiVersion: apps/v1
kind: Deployment
metadata:
  name: stremio-web
  namespace: your-namespace
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stremio-web
  template:
    metadata:
      labels:
        app: stremio-web
    spec:
      nodeSelector:
        kubernetes.io/hostname: your-value
      containers:
      - name: stremio-web
        image: your-registry/your-image:latest
        imagePullPolicy: Always # Ensure it pulls the new image from the registry
        ports:
        - containerPort: 1234
---
apiVersion: v1
kind: Service
metadata:
  name: stremio-web-service
  namespace: your-namespace
spec:
  type: NodePort
  selector:
    app: stremio-web
  ports:
    - port: 1234
      targetPort: 1234
      nodePort: 1234
