    lastUpdateTime: "2026-04-10T16:32:38Z"
    message: ReplicaSet "n8n-app" has successfully progressed.
    reason: "REDACTED_BASE64_DATA"
    status: "True"
    type: Progressing
  observedGeneration: 28
  readyReplicas: 1
