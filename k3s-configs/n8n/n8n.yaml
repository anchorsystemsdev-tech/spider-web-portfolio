apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-value
  namespace: your-namespace
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: n8n
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - env:
        - name: N8N_RUNNERS_ENABLED
          value: "true"
        - name: N8N_RUNNERS_MODE
          value: external
        - name: N8N_RUNNERS_AUTH_TOKEN
          value: "your-value"

        - name: DB_TYPE
          value: postgresdb
        - name: DB_POSTGRESDB_HOST
          value: postgres
        - name: DB_POSTGRESDB_USER
          value: your-value
        - name: DB_POSTGRESDB_PASSWORD
          value: "your-value"
        - name: N8N_REDIS_HOST
          value: redis-grid
        - name: N8N_REDIS_PORT
          value: "your-value"
        - name:  QUEUE_BULL_REDIS_TYPE
          value: your-value
        - name: QUEUE_BULL_REDIS_SENTINEL_NAME
          value: your-value
        - name: N8N_SECURE_COOKIE
          value: "false"
        - name: N8N_ENCRYPTION_KEY
          value: "your-value"
        - name: N8N_VERSION_NOTIFICATIONS_ENABLED
          value: "false"
        - name: N8N_RUNNERS_HOST
          value: your-value
        - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
          value: your-value
        - name: N8N_RESTRICT_FILE_ACCESS_TO
          value: /your-local-path;/home/node/.n8n-files
        image: your-registry/your-image:latest
        imagePullPolicy: IfNotPresent
        name: your-value
        ports:
        - containerPort: your-value
          protocol: TCP
        - containerPort: your-value
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /your/local/path
          name: your-value
        - mountPath: /your/local/path
          name: your-value
      dnsPolicy: ClusterFirst
      nodeSelector:
        lane: your-value
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      tolerations:
      - effect: NoSchedule
        key: "REDACTED_SECRET"
        operator: Exists
      - effect: NoSchedule
        key: "REDACTED_SECRET"
        operator: Exists
      volumes:
      - hostPath:
          path: /your/local/path
          type: Directory
        name: your-value
      - hostPath:
          path: /your/local/path
          type: DirectoryOrCreate
        name: your-value
status:
  availableReplicas: 1
  conditions:
